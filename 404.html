<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      const redirectTo =
        window.location.protocol + '//' + window.location.host + '/';
      window.location.replace(redirectTo + '?' + 'redirect=' + window.location.pathname);
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
